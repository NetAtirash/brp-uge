name: Validate BRP UGE

on:
  push:
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript module syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f -name '*.mjs' -print0)
      - name: Run offline regression tests
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/*.mjs; do
            echo "Running $test"
            node "$test"
          done
