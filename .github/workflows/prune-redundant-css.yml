name: Prune redundant CSS rules with byte-identical runtime guard
on:
  push:
    branches:
      - refactor/v1.21.11-css-structural-cleanup

permissions:
  contents: write

concurrency:
  group: brp-uge-css-prune-source
  cancel-in-progress: false

jobs:
  verify-and-prune:
    if: contains(github.event.head_commit.message, '[prune-core-css]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned compiler
        run: npm ci
      - name: Prune provably redundant rules
        run: |
          set -euo pipefail
          node --check scripts/prune-css-rules.mjs
          node scripts/prune-css-rules.mjs
          node scripts/build-css.mjs --check
          node tests/css-structural-cleanup.mjs
          for f in tests/*.mjs; do node "$f"; done
      - name: Package integrity check
        run: |
          python3 scripts/build_release.py --tag v1.21.11 --output dist
          python3 -m zipfile -t dist/brp-uge.zip
      - name: Commit verified source-only change
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles/brp-*.css docs/css-optimization/STRUCTURAL_BEFORE_AFTER.json docs/css-optimization/STRUCTURAL_BEFORE_AFTER.md
          if git diff --cached --quiet; then
            echo "No redundant rules removable with exact compiled-output parity."
          else
            git commit -m "refactor(css): remove provably redundant rules without changing runtime bytes"
            git push origin HEAD:refactor/v1.21.11-css-structural-cleanup
          fi
